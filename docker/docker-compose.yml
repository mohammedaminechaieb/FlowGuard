services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: flowguard
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      MAX_HEAP_SIZE: 512M      # keep memory low on a laptop
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # One-shot job: creates/updates the Cassandra tables, then exits.
  cassandra-init:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    image: flowguard-spark:latest
    container_name: flowguard-cassandra-init
    environment:
      CASSANDRA_HOST: cassandra
    depends_on:
      cassandra:
        condition: service_healthy
    working_dir: /opt/flowguard
    volumes:
      - ../streaming:/opt/flowguard/streaming:ro
    command: ["python", "streaming/cassandra_setup.py"]
    restart: "no"


  spark:
    build:
      context: ..
      dockerfile: docker/spark.Dockerfile
    image: flowguard-spark:latest
    container_name: flowguard-spark
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    working_dir: /opt/flowguard
    ports:
      - "4040:4040"   # Spark UI
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MODEL_DIR: /opt/flowguard/models
      MAX_OFFSETS_PER_TRIGGER: ${MAX_OFFSETS_PER_TRIGGER:-500}
      CHECKPOINT_PATH: /opt/flowguard/checkpoints/spark_inference
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../streaming:/opt/flowguard/streaming:ro
      - ../ai_module/artifacts:/opt/flowguard/models:ro
      - ../checkpoints:/opt/flowguard/checkpoints
    command:
      - spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/opt/ivy
      - --conf
      - spark.cassandra.connection.host=cassandra
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,com.datastax.spark:spark-cassandra-connector_2.12:3.5.1
      - /opt/flowguard/streaming/spark_consumer.py
    restart: on-failure:3

  spark-archive:
    image: flowguard-spark:latest
    container_name: flowguard-spark-archive
    profiles: ["archive"]
    networks:
      - default
      - hadoop
    depends_on:
      kafka:
        condition: service_healthy
    working_dir: /opt/flowguard
    ports:
      - "4041:4040"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ARCHIVE_PATH: hdfs://hadoop-master:9000/flowguard/archive
      ARCHIVE_CHECKPOINT_PATH: hdfs://hadoop-master:9000/flowguard/checkpoints/archive_raw
      ARCHIVE_TRIGGER_INTERVAL: ${ARCHIVE_TRIGGER_INTERVAL:-30 seconds}
      HADOOP_USER_NAME: root
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../streaming:/opt/flowguard/streaming:ro
      - ../checkpoints:/opt/flowguard/checkpoints
    command:
      - spark-submit
      - --master
      - local[2]
      - --conf
      - spark.jars.ivy=/opt/ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      - /opt/flowguard/streaming/archive_raw_stream.py
    restart: on-failure:3

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin   # demo only
      # this is a plugin not a package so it belongs here not in the requirements.txt file
      GF_INSTALL_PLUGINS: hadesarchitect-cassandra-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  cassandra_data:
  grafana_data:

networks:
  default:
    name: flowguard-net
  hadoop:
    external: true
    name: hadoop